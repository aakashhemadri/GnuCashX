---
name: gnucashx
description: GnuCashX a cross-platform mobile app for the GnuCash Accounting Software
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.1+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  archive: ^4.7.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  provider: ^6.1.2
  dynamic_color: <2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

flutter_intl:
  main_locale: en_US
  enabled: true